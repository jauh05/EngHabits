# Blok location untuk SSE battle. Tempel di dalam blok server enghabits, di atas location /api/.
# Tanpa proxy_buffering off, nginx menahan event sehingga undangan dan soal terlambat sampai.
location = /api/battles/events {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-cache" always;
}
