# Header keamanan untuk nginx. Salin ke /etc/nginx/snippets/security-headers.conf di server.
# nginx hanya mewarisi add_header dari blok server kalau blok location tidak punya add_header sendiri,
# jadi file ini juga harus di-include di setiap location yang punya add_header (lihat DECISIONS.md).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;
